name: mercanova

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mercanova
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mercanova"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Base efímera para tests de integración y E2E (no persiste nada).
  db-test:
    image: pgvector/pgvector:pg17
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mercanova_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mercanova_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
